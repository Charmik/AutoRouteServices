# Expose the profiler flamegraphs under http://<host>/profiler/
#
# Reverse-proxies to the local auth_server.py (127.0.0.1:8400), reusing its
# HTTP Basic auth and directory autoindex. install.sh copies this to
# /etc/nginx/snippets/routecycle-profiler.conf and adds an `include` for it
# into the site's server{} block. To wire it up by hand instead, add
#     include /etc/nginx/snippets/routecycle-profiler.conf;
# inside the server{} block, then: sudo nginx -t && sudo systemctl reload nginx
#
location = /profiler { return 301 /profiler/; }

location /profiler/ {
    proxy_pass http://127.0.0.1:8400/;
    # Rewrite the dir-listing 301s (e.g. /28-Jun -> /28-Jun/) back under /profiler/
    proxy_redirect / /profiler/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
